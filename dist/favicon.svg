<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kgold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="50%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#99772B" />
    </linearGradient>
    <linearGradient id="kbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E2E" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Luxury Squircle Background -->
  <rect width="64" height="64" rx="14" fill="url(#kbg)" stroke="#C9A84C" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Inner Architectural Border Accent -->
  <rect x="4" y="4" width="56" height="56" rx="11" fill="none" stroke="#C9A84C" stroke-opacity="0.12" stroke-width="1" />

  <!-- Monogram "K" Combined with Financial Growth Bars -->
  <g filter="url(#glow)">
    <!-- Vertical Pillar of K -->
    <rect x="15" y="14" width="6" height="36" rx="2" fill="url(#kgold)" />
    
    <!-- Top Diagonal Arm of K -->
    <path d="M19 32 L34 16 C35.5 14.5 38 15.5 38 17.5 L38 21 L26 33 Z" fill="url(#kgold)" />
    
    <!-- Bottom Diagonal Arm of K -->
    <path d="M22 30 L37 46.5 C38.2 48 40.5 47.5 40.5 45.5 L40.5 42 L28 28 Z" fill="url(#kgold)" />

    <!-- 3 Dynamic Financial Growth Columns in Upper Right -->
    <rect x="42" y="32" width="3" height="15" rx="1" fill="url(#kgold)" opacity="0.6" />
    <rect x="47" y="25" width="3" height="22" rx="1" fill="url(#kgold)" opacity="0.8" />
    <rect x="52" y="17" width="3" height="30" rx="1" fill="url(#kgold)" opacity="1.0" />
  </g>

  <!-- Trust Shield Accent Point -->
  <circle cx="18" cy="15" r="2" fill="#FFFFFF" opacity="0.85" />
</svg>
