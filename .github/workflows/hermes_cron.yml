name: Hermes Content & Strategy Automation

on:
  schedule:
    # Führt das Hermes-Skript jeden Montag um 08:00 Uhr UTC aus
    - cron: '0 8 * * 1'
  workflow_dispatch: # Erlaubt auch manuelles Ausführen im GitHub Dashboard

jobs:
  run-hermes:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code & Obsidian Vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install @supabase/supabase-js

      - name: Execute Hermes Automation Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/hermes_runner.js

      - name: Commit & Push Updated Obsidian Vault & Drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "auto(hermes): weekly social drafts & learnings update"
          git push
