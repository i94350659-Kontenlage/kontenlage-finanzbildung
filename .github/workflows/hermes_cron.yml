name: Hermes v2.3 — Content, Social (6-Kanal) Automation

on:
  schedule:
    # Jeden Montag um 08:00 Uhr UTC — vollautomatisch
    - cron: '0 8 * * 1'
  workflow_dispatch: # Manuelles Ausführen im GitHub Dashboard jederzeit möglich

jobs:
  # Hinweis: Der Production-Deploy läuft nicht mehr über diesen Workflow, sondern
  # über die Vercel Git Integration (Projekt "kontolage-finanzbildung" ← Repo,
  # Production-Branch: main). Jeder Push auf main baut und deployed automatisch
  # auf https://kontolage.de. Ein eigener Deploy-Job hier würde doppelt deployen.

  # ── Job 1: Hermes Content & Social Publishing (Montag 08:00) ──────────────
  run-hermes:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Checkout Code & Obsidian Vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Execute Hermes AI Automation (6 Kanäle)
        env:
          # ── AI Provider-Kette (Reihenfolge = Priorität) ─────────────────
          # Primär
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          # Fallback-Gateways (jeder nur aktiv, wenn Key gesetzt)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          EDENAI_API_KEY: ${{ secrets.EDENAI_API_KEY }}
          EDENAI_MODEL: ${{ secrets.EDENAI_MODEL }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          REQUESTY_MODEL: ${{ secrets.REQUESTY_MODEL }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          TOGETHER_MODEL: ${{ secrets.TOGETHER_MODEL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ secrets.MISTRAL_MODEL }}
          # Generische Gateway-Slots (OpenAI-kompatibel, für eigene Gateways)
          GATEWAY1_NAME: ${{ secrets.GATEWAY1_NAME }}
          GATEWAY1_URL: ${{ secrets.GATEWAY1_URL }}
          GATEWAY1_API_KEY: ${{ secrets.GATEWAY1_API_KEY }}
          GATEWAY1_MODEL: ${{ secrets.GATEWAY1_MODEL }}
          GATEWAY2_NAME: ${{ secrets.GATEWAY2_NAME }}
          GATEWAY2_URL: ${{ secrets.GATEWAY2_URL }}
          GATEWAY2_API_KEY: ${{ secrets.GATEWAY2_API_KEY }}
          GATEWAY2_MODEL: ${{ secrets.GATEWAY2_MODEL }}
          # ── Supabase (Datenbank & Logging) ───────────────────────────
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # ── Website URL ──────────────────────────────────────────────
          SITE_URL: ${{ secrets.SITE_URL }}
          # ── Telegram (Direktes Posting — kostenlos) ──────────────────
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # ── X/Twitter (OAuth 1.0a) ────────────────────────────────────
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # ── Meta: Facebook Page ───────────────────────────────────────
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          # ── Meta: Instagram Graph API (2-Step: Container + Publish) ──
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          # ── LinkedIn API v2 (UGC Post, w_member_social scope) ─────────
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          # ── Stripe (Testmodus bis Gewerbeanmeldung) ───────────────────
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          node scripts/hermes_runner.js

      - name: Commit & Push Updated Drafts & Learnings
        run: |
          git config user.name "Hermes[bot]"
          git config user.email "hermes@kontenlage.de"
          git add .
          git diff-index --quiet HEAD || git commit -m "auto(hermes): weekly social drafts + learnings update [skip ci]"
          git push
