name: Hermes Daily Newsletter & News Ingestion Engine

on:
  schedule:
    # Täglich um 05:30 Uhr UTC (06:30 Uhr MEZ / 07:30 Uhr MESZ)
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Spezifische Kategorie wählen (oder "all" für automatischen News-/Decay-Score)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - Makroökonomie & EZB
          - Weltwirtschaft & Geopolitik
          - Kapitalerträge
          - Krypto & Digital Assets
          - Holding & GmbH
          - Immobilien
          - Altersvorsorge
          - ETF & Indexfonds
          - Arbeitnehmer
      dry_run:
        description: 'Dry Run (Generierung testen ohne Dateien zu verändern)'
        required: false
        default: false
        type: boolean

jobs:
  hermes-daily-newsletter:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Execute Hermes Daily Newsletter & News Ingestion
        env:
          # ── Primär: NVIDIA NIM Gateway (Nemotron) ─────────────────────────
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b' }}

          # ── Sekundär & Fallback AI-Gateways ───────────────────────────────
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          ORCAROUTER_MODEL: ${{ secrets.ORCAROUTER_MODEL }}
          ZENMUXAI_API_KEY: ${{ secrets.ZENMUXAI_API_KEY }}
          ZENMUXAI_MODEL: ${{ secrets.ZENMUXAI_MODEL }}
          TOGETHERAI_API_KEY: ${{ secrets.TOGETHERAI_API_KEY }}
          TOGETHERAI_MODEL: ${{ secrets.TOGETHERAI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ secrets.MISTRAL_MODEL }}

          # ── Supabase & Alerts ─────────────────────────────────────────────
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SITE_URL: 'https://kontolage.de'

          # ── Run Options ───────────────────────────────────────────────────
          CATEGORY: ${{ inputs.category || 'all' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          node scripts/hermes_daily_newsletter_cron.mjs

      - name: Validate Compliance & Newsletter Lint
        run: |
          node tools/newsletter-lint.mjs
          node tools/generate-sitemap.mjs

      - name: Commit & Push New Newsletter Issue to Main
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "Hermes[bot]"
          git config user.email "hermes@kontolage.de"
          git add webseitenversionen/4.9.2026/content/newsletter.json
          git add webseitenversionen/4.9.2026/content/routes.json
          git add webseitenversionen/4.9.2026/public/sitemap.xml
          git add dist/sitemap.xml 2>/dev/null || true
          if ! git diff-index --quiet HEAD; then
            git commit -m "auto(hermes): publish daily financial education newsletter issue [skip ci]"
            git push origin main
            echo "✅ Neuer Newsletter veröffentlicht und zu main gepusht (Vercel Auto-Deploy aktiv)."
          else
            echo "ℹ Keine Änderungen zu committen."
          fi
