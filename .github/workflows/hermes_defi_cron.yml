name: Hermes DeFi Ensemble Risk & Backtest Automation

on:
  schedule:
    # 2-mal in der Woche vollautomatisch:
    # 1. Dienstag um 07:00 Uhr UTC (Mid-week Risk Check)
    - cron: '0 7 * * 2'
    # 2. Freitag um 16:00 Uhr UTC (Weekend Exposure & Backtest Audit)
    - cron: '0 16 * * 5'
  workflow_dispatch: # Manuelles Ausführen im GitHub Dashboard jederzeit möglich

jobs:
  run-defi-ensemble:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Hermes DeFi Ensemble & Backtesting Engine
        env:
          # ── Supabase (State lives in Backend DB) ───────────────────
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # ── Website URL ──────────────────────────────────────────────
          SITE_URL: ${{ secrets.SITE_URL }}
          # ── Telegram (Direktes Posting) ──────────────────────────────
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          node scripts/hermes_defi_researcher.js

      - name: Commit & Push Updated Backtest Audit Logs
        run: |
          git config user.name "HermesDeFi[bot]"
          git config user.email "hermes-defi@kontolage.de"
          git add .
          git diff-index --quiet HEAD || git commit -m "auto(hermes-defi): backtest audit & ensemble risk update [skip ci]"
          git push
